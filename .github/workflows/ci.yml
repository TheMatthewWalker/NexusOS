name: Core CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/NexusOS.Core/NexusOS.Core.csproj --configuration Release
      - run: dotnet build src/NexusOS.Cli/NexusOS.Cli.csproj --configuration Release
      - run: dotnet test tests/NexusOS.Tests/NexusOS.Tests.csproj --configuration Release
