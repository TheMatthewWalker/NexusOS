name: Nexus Core CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, unit tests and smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore projects
        run: |
          dotnet restore src/NexusOS.Core/NexusOS.Core.csproj
          dotnet restore src/NexusOS.Cli/NexusOS.Cli.csproj
          dotnet restore tests/NexusOS.Tests/NexusOS.Tests.csproj

      - name: Build Core
        run: dotnet build src/NexusOS.Core/NexusOS.Core.csproj -c Release --no-restore -warnaserror

      - name: Build CLI
        run: dotnet build src/NexusOS.Cli/NexusOS.Cli.csproj -c Release --no-restore -warnaserror

      - name: Run unit tests and publish results
        run: dotnet test tests/NexusOS.Tests/NexusOS.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults

      - name: Publish Core and CLI
        run: |
          dotnet publish src/NexusOS.Core/NexusOS.Core.csproj -c Release --no-restore -o out/core
          dotnet publish src/NexusOS.Cli/NexusOS.Cli.csproj -c Release --no-restore -o out/cli

      - name: End-to-end smoke tests with mock Ollama
        run: bash scripts/ci-smoke.sh

      - name: Validate benchmark parser
        run: python3 -m unittest discover -s tests/bench -v

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-core-test-results
          path: |
            TestResults/
            out/*.log
          if-no-files-found: ignore
          retention-days: 14
