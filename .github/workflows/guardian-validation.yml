name: Guardian Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test strict change schema
        run: python3 -m unittest discover -s tests/guardian -v
      - name: Validate generated Nix expression
        run: |
          echo '[{"option":"services.printing.enable","enabled":true}]' > /tmp/guardian-plan.json
          python3 scripts/guardian/validate.py --changes /tmp/guardian-plan.json > /tmp/guardian-generated.nix
          test -s /tmp/guardian-generated.nix
      - name: Build non-activating deployment candidate
        run: |
          python3 scripts/guardian/candidate.py --changes /tmp/guardian-plan.json --baseline generation-42 --output /tmp/guardian-candidate.json
          python3 - <<'PY'
          import json
          with open("/tmp/guardian-candidate.json", encoding="utf-8") as f:
              candidate = json.load(f)
          assert candidate["activation"] == "prohibited"
          assert candidate["rollbackTarget"] == "generation-42"
          assert candidate["operations"] == ["evaluate", "build", "vm-test"]
          PY
      - name: Verify fail-closed review gate
        run: |
          python3 - <<'PY'
          import json
          candidate = json.load(open("/tmp/guardian-candidate.json", encoding="utf-8"))
          evidence = {"candidateId":candidate["candidateId"],"baseline":candidate["baseline"],
                      "checks":{"evaluate":True,"build":False,"vm-test":True}}
          with open("/tmp/guardian-failed-evidence.json","w",encoding="utf-8") as stream:
              json.dump(evidence,stream)
          PY
          if python3 scripts/guardian/recovery_gate.py --candidate /tmp/guardian-candidate.json --changes /tmp/guardian-plan.json --evidence /tmp/guardian-failed-evidence.json --current-baseline generation-42; then
            echo "ERROR: failed candidate was eligible for review" >&2
            exit 1
          fi
      - name: Confirm no deployment operations
        run: |
          ! grep -E 'nixos-rebuild.*(switch|boot)|sudo|pkexec' scripts/guardian/validate.py
