name: Guardian Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Guardian unit and protocol tests (shared schema, Ed25519, broker)
        run: python3 -m unittest discover -s tests/guardian -v
      - name: Validate generated Nix expression
        run: |
          echo '[{"option":"services.printing.enable","enabled":true}]' > /tmp/guardian-plan.json
          python3 scripts/guardian/validate.py --changes /tmp/guardian-plan.json > /tmp/guardian-generated.nix
          test -s /tmp/guardian-generated.nix
      - name: Build non-activating candidate bound to a store-path baseline
        run: |
          python3 scripts/guardian/candidate.py --changes /tmp/guardian-plan.json \
            --baseline /nix/store/00000000000000000000000000000000-nixos-system-guardian-ci-26.05 \
            --host-config 'path:./nix/guardian#nixosConfigurations.guardian-bootloader-lab' --output /tmp/guardian-candidate.json
          python3 - <<'PY'
          import json
          candidate = json.load(open("/tmp/guardian-candidate.json", encoding="utf-8"))
          assert candidate["activation"] == "prohibited"
          assert candidate["rollbackTarget"] == candidate["baseline"]
          assert candidate["operations"] == ["evaluate", "build", "vm-test"]
          PY
      - name: Symbolic baselines are rejected
        run: |
          if python3 scripts/guardian/candidate.py --changes /tmp/guardian-plan.json --baseline generation-42 \
               --host-config 'path:./nix/guardian#nixosConfigurations.guardian-bootloader-lab'; then
            echo "ERROR: symbolic baseline accepted" >&2; exit 1
          fi
      - name: Confirm no deployment operations outside the staging executor
        run: |
          # Only scripts/guardian/stage_executor.py may stage a generation, and
          # nothing may switch the running system, escalate, or spawn a shell.
          pattern='nixos-rebuild|switch-to-configuration|nix-env --profile|sudo|pkexec|shell=True|os\.system'
          if grep -rnE "$pattern" scripts/guardian --include='*.py' | grep -v '^scripts/guardian/stage_executor.py:'; then
            echo "ERROR: deployment or escalation primitive outside the staging executor" >&2
            exit 1
          fi
          if grep -nE 'nixos-rebuild|switch-to-configuration (switch|test)|sudo|pkexec|shell=True|os\.system' scripts/guardian/stage_executor.py 2>/dev/null; then
            echo "ERROR: staging executor may only use 'switch-to-configuration boot'" >&2
            exit 1
          fi
