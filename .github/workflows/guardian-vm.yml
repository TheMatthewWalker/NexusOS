name: Guardian NixOS VM
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nix/guardian/**'
      - '.github/workflows/guardian-vm.yml'
permissions:
  contents: read
jobs:
  vm:
    name: Boot and probe isolated NixOS guest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Verify candidate and compare Nix module
        run: |
          python3 scripts/guardian/candidate.py --changes nix/guardian/candidate-changes.json --baseline generation-42 --output /tmp/guardian-candidate.json
          python3 scripts/guardian/verify_candidate.py --candidate /tmp/guardian-candidate.json --changes nix/guardian/candidate-changes.json --output /tmp/guardian-verified.nix
          diff -u nix/guardian/generated-candidate.nix /tmp/guardian-verified.nix
      - name: Nix flake evaluation
        run: nix flake show ./nix/guardian --no-update-lock-file --accept-flake-config
      - name: Evaluate real bootloader VM derivation
        run: |
          nix eval --raw ./nix/guardian#packages.x86_64-linux.guardian-bootloader-vm.drvPath --no-update-lock-file
          nix eval --raw ./nix/guardian#packages.x86_64-linux.guardian-broken-generation.drvPath --no-update-lock-file
      - name: Run QEMU-based guest tests
        run: |
          nix build ./nix/guardian#checks.x86_64-linux.guardian-boot --no-update-lock-file --print-build-logs
          nix build ./nix/guardian#checks.x86_64-linux.guardian-recovery --no-update-lock-file --print-build-logs
