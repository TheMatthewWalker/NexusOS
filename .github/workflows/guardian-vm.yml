name: Guardian NixOS VM
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nix/guardian/**'
      - '.github/workflows/guardian-vm.yml'
permissions:
  contents: read
jobs:
  vm:
    name: Boot and probe isolated NixOS guest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Resolve and record Nix dependency revisions
        run: nix flake lock ./nix/guardian
      - name: Print public dependency lockfile
        run: |
          echo GUARDIAN_LOCK_BEGIN
          cat nix/guardian/flake.lock
          echo GUARDIAN_LOCK_END
      - name: Upload lockfile for pinning
        uses: actions/upload-artifact@v4
        with:
          name: guardian-nix-lockfile
          path: nix/guardian/flake.lock
      - name: Nix flake evaluation
        run: nix flake show ./nix/guardian --accept-flake-config
      - name: Run QEMU-based guest tests
        run: nix build ./nix/guardian#checks.x86_64-linux.guardian-boot --print-build-logs
