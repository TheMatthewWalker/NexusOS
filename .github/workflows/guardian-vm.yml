name: Guardian NixOS VM
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nix/guardian/**'
      - '.github/workflows/guardian-vm.yml'
permissions:
  contents: read
jobs:
  vm:
    name: Boot and probe isolated NixOS guest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Nix flake evaluation
        run: nix flake show ./nix/guardian --no-write-lock-file --accept-flake-config
      - name: Run QEMU-based guest tests
        run: nix build ./nix/guardian#checks.x86_64-linux.guardian-boot --no-write-lock-file --print-build-logs
