name: M2 Real Secret Service
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-keyring:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install real Secret Service dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dbus-x11 gnome-keyring libsecret-tools libglib2.0-bin
      - name: Restore and build tests
        run: dotnet build tests/NexusOS.Tests/NexusOS.Tests.csproj --configuration Debug
      - name: Exercise isolated live keyring (no real user secrets)
        run: bash scripts/ci/real-secret-service.sh
