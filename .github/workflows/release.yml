name: NexusOS release
# Publishing a release: push a tag such as v0.4.0 on a commit that is on main,
#
#   git tag v0.4.0 && git push origin v0.4.0
#
# or run this workflow by hand (Actions, NexusOS release, Run workflow) with the
# version: a tag that does not exist yet is made on main's newest commit when
# the release is published.
#
# This builds the installer image from that commit, checks it, publishes it
# (in parts under 2 GB, GitHub's limit for a release file, with SHA256SUMS and
# the command to join them) as a GitHub release, and then moves the `release`
# branch to the commit. Installed computers follow that branch: Guardian's
# weekly check finds the new commit, builds and tests it, and offers it as a
# NexusOS update, approved with the person's password (docs/GUARDIAN-DEPLOYMENT.md).
# The branch only moves forward, and only after the image built.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The version to publish, for example v0.4.0 (made on main's newest commit if it is not a tag yet)
        required: true
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Free runner disk for the image
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The commit to publish (the tag's, or main's newest when the tag is new)
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then git checkout -q "$TAG"
          else git checkout -q origin/main; echo "$TAG is new: publishing main at $(git rev-parse --short HEAD)"; fi
      - name: The tag names a version and a commit on main
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Tags look like v0.4.0, not $TAG" >&2; exit 1; }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "$TAG is not on main" >&2; exit 1; }
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Tests that need no VM
        run: |
          python3 -m unittest discover -s tests/installer
          python3 -m unittest discover -s tests/guardian
      - name: Build the installer images
        run: |
          nix build .#iso --no-update-lock-file --print-build-logs --out-link result
          nix build .#iso-slim --no-update-lock-file --print-build-logs --out-link result-slim
      - name: The image says which release it is
        run: |
          rev="$(nix eval --raw --no-update-lock-file '.#nixosConfigurations.installer.config.environment.etc."nexusos-release.json".text' | jq -r .rev)"
          [ "$rev" = "$(git rev-parse HEAD)" ] || { echo "the image does not record this commit ($rev)" >&2; exit 1; }
      - name: Split them into parts GitHub accepts, with checksums
        run: |
          mkdir dist
          cd dist
          : > SHA256SUMS
          # Split straight from the build, so no extra copy of each image is needed on the runner.
          publish() {
            iso="$(find -L "../$1/iso" -name '*.iso' | head -n1)"
            (cd "$(dirname "$iso")" && sha256sum "$(basename "$iso")") | sed "s|  .*|  $2|" >> SHA256SUMS
            split -b 1900M -d -a 2 "$iso" "$2.part-"
            sha256sum "$2".part-* >> SHA256SUMS
          }
          name="nexusos-${TAG#v}-x86_64.iso"
          slim="nexusos-${TAG#v}-slim-x86_64.iso"
          publish result "$name"
          publish result-slim "$slim"
          cp ../scripts/release/get-nexusos.sh ../scripts/release/get-nexusos.ps1 ../scripts/release/Get-NexusOS.cmd ../scripts/release/Get-NexusOS-Slim.cmd .
          cat > README.txt <<EOF
          NexusOS ${TAG}: the installer image, in parts (GitHub limits each file to 2 GB).
          Two images: $name carries the local AI model, so Nexus works straight away even
          offline; $slim is smaller and downloads the model once the computer is online.

          The easy way: Get NexusOS downloads the parts, checks them and joins them for you.
            Windows:        download Get-NexusOS.cmd (or Get-NexusOS-Slim.cmd) and double-click it (the image goes to Downloads)
            Linux or Mac:   curl -fsSL https://raw.githubusercontent.com/TheMatthewWalker/NexusOS/main/scripts/release/get-nexusos.sh | sh
                            (add  -s -- --slim  after sh for the slim image)

          By hand: download every part and SHA256SUMS into one folder, then join them:
            Linux or Mac:   cat $name.part-* > $name
            Windows:        copy /b $name.part-00 + $name.part-01 + ... $name
          Check it:         sha256sum -c SHA256SUMS --ignore-missing
          The slim image's parts are $slim.part-*, joined the same way.
          Then write the .iso to a USB stick (docs/INSTALL.md).
          EOF
          sed -i 's/^          //' README.txt
          ls -la
      - name: Publish the release
        run: |
          # A tag with a suffix (v0.3.0-rc.1) is a pre-release: the testing channel only.
          pre=""; case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/* --title "NexusOS ${TAG#v}" --target "$(git rev-parse HEAD)" $pre \
            --notes-file scripts/release/notes.md
      - name: Move the channel branches to this commit (forward only)
        run: |
          # Computers follow release (stable) or testing (Settings, Updates, Channel).
          # A release goes to both; a pre-release to testing only. testing is left
          # alone when it is already ahead with a newer pre-release.
          case "$TAG" in
            *-*) git push origin "HEAD:refs/heads/testing" ;;
            *)   git push origin "HEAD:refs/heads/release"
                 git push origin "HEAD:refs/heads/testing" || echo "testing is ahead of $TAG; left as it is" ;;
          esac
